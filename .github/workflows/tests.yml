# À chaque modification publiée : tous les tests. En cas d'échec, GitHub envoie un email.
name: Tests
# Audit des robots du 10/10/2026 : pas de tests pour un envoi qui ne change que des notes (.md) ; un nouvel envoi annule le précédent.
on:
  push:
    branches: [main, "entretien-tests/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock jsdom
      - run: MUET=1 node tools/test_site.mjs
      - run: node tools/sabotage.mjs
      - run: node tools/test_sw.mjs
      - run: node tools/test_video.mjs
      - run: node tools/test_avis.mjs
      - run: node tools/test_robot.mjs
